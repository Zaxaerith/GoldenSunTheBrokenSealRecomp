# Golden Sun: The Broken Seal (USA/Europe, AGSE01) — gbarecomp configuration

[program]
name = "Golden Sun: The Broken Seal"
id = "gs1"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x080003C0
speculative_literal_harvest = true
aot_scan_start = 0x080000C0
aot_scan_end = 0x08185024
static_resume_all = true

[identity]
sha1 = "5c4695205413df7db52b9a184815a07783999971"

[game]
short_name = "gs1"

[bios]
path = "gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[rom]
path = "Golden Sun(UE)(Nintendo)(64Mb).gba"
sha1 = "5c4695205413df7db52b9a184815a07783999971"

[save]
type = "flash512"
path = "gs1.sav"

# ── Fixed IWRAM code copies (rom_770.s) ─────────────────────────────────────
# Note: 0x03000658..0x03001388 (Func_dc8 / SoundMainRAM) is the self-modifying
# MP2K software mixer (.word 0xfedcba98 placeholders) and is routed to live
# RAM interpretation via g_runtime_force_interp_hook.
[[code_copy]]
runtime_start = 0x03000000
source_start = 0x08000770
size = 0x00000658
name = "iwram_rom_770_part1"
note = "Master IRQ handler, fixed-point math, fast fill, matrix math, division, LZ decompressor"

[[code_copy]]
runtime_start = 0x03001388
source_start = 0x08001AF8
size = 0x00000078
name = "iwram_rom_770_part2"
note = "Fast block copy Func_1af8"

